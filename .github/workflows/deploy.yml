name: Build and Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch: # allow manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/mashookhkhanlol/e-commerce-medical/medusa-backend
  STOREFRONT_IMAGE: ghcr.io/mashookhkhanlol/e-commerce-medical/nextjs-storefront

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Build Docker images and push to GitHub Container Registry
  # ──────────────────────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Medusa Backend ──────────────────────────────────────
      - name: Build and push medusa-backend
        uses: docker/build-push-action@v5
        with:
          context: ./medusa-backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Next.js Storefront ──────────────────────────────────
      # NEXT_PUBLIC_* vars must be passed as build args since they
      # are inlined at build time by Next.js (not runtime env vars)
      - name: Build and push nextjs-storefront
        uses: docker/build-push-action@v5
        with:
          context: ./nextjs-storefront
          push: true
          tags: |
            ${{ env.STOREFRONT_IMAGE }}:latest
            ${{ env.STOREFRONT_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ secrets.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SHOP_NAME=${{ secrets.NEXT_PUBLIC_SHOP_NAME }}
            NEXT_PUBLIC_SHOP_PHONE=${{ secrets.NEXT_PUBLIC_SHOP_PHONE }}
            NEXT_PUBLIC_SHOP_WHATSAPP=${{ secrets.NEXT_PUBLIC_SHOP_WHATSAPP }}
            NEXT_PUBLIC_SHOP_ADDRESS=${{ secrets.NEXT_PUBLIC_SHOP_ADDRESS }}
            NEXT_PUBLIC_SHOP_HOURS=${{ secrets.NEXT_PUBLIC_SHOP_HOURS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  # Job 2: Deploy to VPS via SSH — pull new images and restart
  # ──────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "==> Deploying medstore-platform..."
            cd /home/max/websites/med-store/e-commerce-medical

            # Ensure required external networks exist (idempotent)
            docker network create cloudflare-tunnel 2>/dev/null || true
            docker network create medstore-net 2>/dev/null || true

            # Pull the latest images (built and pushed in job 1)
            docker compose pull

            # Restart all services with new images
            # --remove-orphans cleans up any services no longer in compose file
            docker compose up -d --remove-orphans

            # Clean up old images to free disk space
            docker image prune -f

            echo "==> Deploy complete at $(date -u)"
