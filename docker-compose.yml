
services:
  # ─────────────────────────────────────────────────────────────────
  # PostgreSQL — dedicated DB for this project
  # ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medstore-postgres
    environment:
      POSTGRES_DB: medusa_medstore
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_medstore_data:/var/lib/postgresql/data
    networks:
      - medstore-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa_medstore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────
  # Redis — DB index 2 to isolate from other projects on shared Redis
  # ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medstore-redis
    command: redis-server --databases 16
    networks:
      - medstore-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────
  # Medusa Backend — pulls pre-built image from GHCR, no local build
  # ─────────────────────────────────────────────────────────────────
  medusa-backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/medusa-backend:latest
    container_name: medusa-backend
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./medusa-backend/.env
    environment:
      MEDUSA_WORKER_MODE: server
    ports:
      - "127.0.0.1:9000:9000"  # Nginx proxies this — not exposed to internet directly
    volumes:
      - medusa_uploads:/app/uploads
      - /dev/null:/app/.env:ro
    networks:
      - medstore-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Medusa Worker — same image as backend, different worker mode
  # ─────────────────────────────────────────────────────────────────
  medusa-worker:
    image: ghcr.io/${GITHUB_REPOSITORY}/medusa-backend:latest
    container_name: medusa-worker
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./medusa-backend/.env
    environment:
      MEDUSA_WORKER_MODE: worker
    volumes:
      - /dev/null:/app/.env:ro
    networks:
      - medstore-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # Next.js Storefront — pulls pre-built image from GHCR
  # ─────────────────────────────────────────────────────────────────
  nextjs-storefront:
    image: ghcr.io/${GITHUB_REPOSITORY}/nextjs-storefront:latest
    container_name: medstore-storefront
    pull_policy: always
    depends_on:
      - medusa-backend
    env_file: ./nextjs-storefront/.env.local
    ports:
      - "127.0.0.1:3001:3000"  # Port 3000 taken by next-portfolio; use 3001
    networks:
      - medstore-net
    restart: unless-stopped

# ─────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────
volumes:
  postgres_medstore_data:
    name: postgres_medstore_data
  medusa_uploads:
    name: medusa_uploads

# ─────────────────────────────────────────────────────────────────
# Networks
# shared-tunnel-net: existing network cloudflared is attached to
# medstore-net: internal Postgres/Redis/worker communication
# ─────────────────────────────────────────────────────────────────
networks:
  medstore-net:
    name: medstore-net
